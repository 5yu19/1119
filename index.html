<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Particle Clock — RGB Dot Discs V6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main aria-label="반투명 RGB 도트 원들로 이루어진 실시간 디지털 시계. 시간이 바뀌면 입자가 흩어졌다가 다시 모이고, 커서를 가져가면 모래처럼 부서집니다.">
    <canvas id="clock" role="img" aria-label="실시간 파티클 시계"></canvas>
    <time id="accessible-time" class="sr-only" aria-live="off"></time>
  </main>
  <script src="script.js"></script>
</body>
</html>
